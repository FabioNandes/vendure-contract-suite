# Jornada carrinho → pedido na Shop API.
#
# Mutations do Vendure devolvem uniões (Order | ErrorResult) com HTTP 200: o erro de negócio
# chega em `data`, não em `errors`. Por isso toda operação pede `__typename` e `errorCode`.

fragment CheckoutOrder on Order {
  id
  code
  state
  active
  totalQuantity
  subTotalWithTax
  shippingWithTax
  totalWithTax
  currencyCode
  lines {
    id
    quantity
    linePriceWithTax
    productVariant {
      id
      sku
    }
  }
  payments {
    id
    method
    state
    amount
  }
}

mutation ShopLogin($username: String!, $password: String!) {
  login(username: $username, password: $password) {
    __typename
    ... on CurrentUser {
      id
      identifier
    }
    ... on ErrorResult {
      errorCode
      message
    }
  }
}

query ActiveOrder {
  activeOrder {
    ...CheckoutOrder
  }
}

mutation AddItemToOrder($productVariantId: ID!, $quantity: Int!) {
  addItemToOrder(productVariantId: $productVariantId, quantity: $quantity) {
    __typename
    ...CheckoutOrder
    ... on ErrorResult {
      errorCode
      message
    }
  }
}

mutation RemoveAllOrderLines {
  removeAllOrderLines {
    __typename
    ... on ErrorResult {
      errorCode
      message
    }
  }
}

mutation SetCustomerForOrder($input: CreateCustomerInput!) {
  setCustomerForOrder(input: $input) {
    __typename
    ... on ErrorResult {
      errorCode
      message
    }
  }
}

mutation SetOrderShippingAddress($input: CreateAddressInput!) {
  setOrderShippingAddress(input: $input) {
    __typename
    ... on ErrorResult {
      errorCode
      message
    }
  }
}

query EligibleShippingMethods {
  eligibleShippingMethods {
    id
    code
    priceWithTax
  }
}

mutation SetOrderShippingMethod($shippingMethodId: [ID!]!) {
  setOrderShippingMethod(shippingMethodId: $shippingMethodId) {
    __typename
    ... on ErrorResult {
      errorCode
      message
    }
  }
}

mutation TransitionOrderToState($state: String!) {
  transitionOrderToState(state: $state) {
    __typename
    ... on Order {
      state
    }
    ... on OrderStateTransitionError {
      errorCode
      message
      transitionError
      fromState
      toState
    }
  }
}

mutation AddPaymentToOrder($input: PaymentInput!) {
  addPaymentToOrder(input: $input) {
    __typename
    ...CheckoutOrder
    ... on ErrorResult {
      errorCode
      message
    }
  }
}
